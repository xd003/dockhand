name: Build and push to Forgejo Packages

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to publish'
        type: string
        required: false
        default: 'manual'
  push:
    tags:
      - 'v*'

jobs:
  docker:
    runs-on: [ubuntu, amd64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Forgejo Container Registry
        uses: docker/login-action@v3
        with:
          registry: git.xd003.cc
          username: ${{ github.actor }}
          password: ${{ secrets.REGISTRY_PAT }}

      - name: Determine tag
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            git.xd003.cc/${{ github.repository }}:${{ steps.vars.outputs.tag }}
            git.xd003.cc/${{ github.repository }}:latest
